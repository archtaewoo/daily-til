name: Daily TIL Auto Commit

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-til-main
  cancel-in-progress: false

jobs:
  generate-til:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with main
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate TIL
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python auto_commit.py

      - name: Commit with natural pattern
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add daily_til.md
          if [ -d code ]; then git add code; fi

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          TIMEZONES=("+0900" "+0900" "+0900" "+0000" "-0700" "+0100")
          TZ_OFFSET="${TIMEZONES[$RANDOM % ${#TIMEZONES[@]}]}"

          # 파이썬이 정한 날짜(TIL_DATE)를 그대로 사용해 본문 헤더와 일치시킨다
          BASE_DATE="${TIL_DATE:-$(date -u +%Y-%m-%d)}"

          HOUR=$((16 + RANDOM % 9))
          if (( HOUR >= 24 )); then
            HOUR=$((HOUR - 24))
          fi

          MINUTE=$((RANDOM % 60))
          SECOND=$((RANDOM % 60))

          COMMIT_DATE="${BASE_DATE}T$(printf '%02d:%02d:%02d' "$HOUR" "$MINUTE" "$SECOND") ${TZ_OFFSET}"

          export GIT_AUTHOR_DATE="$COMMIT_DATE"
          export GIT_COMMITTER_DATE="$COMMIT_DATE"

          MESSAGES=(
            "docs: TIL ${BASE_DATE}"
            "til ${BASE_DATE}"
            "공부 정리"
            "메모"
            "오늘 배운 거"
            "til update"
            "daily note"
          )

          MSG="${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}"

          git commit -m "$MSG"

          # 여기서는 pull 하지 말고 push만 실행
          git push origin HEAD:main
